[project]
name = "open-defense-kit"
version = "2.1.0"
description = "A defense-first security learning and audit toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Imran Shiundu" }
]
keywords = ["security", "defense", "blue-team", "audit", "education", "appsec", "secrets-scanning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/imranshiundu/open-defense-kit"
Repository = "https://github.com/imranshiundu/open-defense-kit"
Issues = "https://github.com/imranshiundu/open-defense-kit/issues"

[project.scripts]
odkit = "odkit.cli:main"

[tool.setuptools]
packages = ["odkit", "odkit.modules"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
