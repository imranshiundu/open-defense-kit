name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ruff (stopper errors + hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Must-fix issues (syntax, undefined names)
        run: ruff check . --select=E9,F63,F7,F82 --output-format=full
      - name: Code hygiene (unused imports/variables)
        run: ruff check odkit/ tests/ --select=F401,F841 --output-format=full

  test:
    name: Pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Run test suite
        run: pytest tests/ -v
      - name: CLI smoke tests
        run: |
          odkit --version
          odkit doctor
          odkit safety
          odkit modules list
          odkit modules info audit-report

  audit-report:
    name: Self-audit report (monitoring)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # Self-monitoring, not a hard gate: scanning the scanner flags its own
      # rule tables (legacy_audit.py and migration_classifier.py contain the
      # literal tokens the audit looks for), so findings here are expected
      # false positives. The artifact still shows the report pipeline works.
      - name: Audit the odkit package (non-blocking)
        run: odkit audit-report odkit --json odk-self-audit.json || true
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: odk-self-audit
          path: odk-self-audit.json
          retention-days: 14
          if-no-files-found: error
