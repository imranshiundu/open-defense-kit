name: Install smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  install:
    name: install.py creates a working odk launcher
    runs-on: ubuntu-latest
    env:
      TERM: "linux"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Run the installer
        run: sudo python3 install.py
      - name: Verify the launcher exists and is executable
        run: |
          # Root installs place the launcher in /usr/bin; non-root in /usr/local/bin.
          LAUNCHER=""
          for p in /usr/bin/odk /usr/local/bin/odk; do
            if [ -x "$p" ]; then LAUNCHER="$p"; break; fi
          done
          if [ -z "$LAUNCHER" ]; then
            echo "odk launcher not found in /usr/bin or /usr/local/bin"
            exit 1
          fi
          echo "Launcher present at $LAUNCHER"
      - name: Verify user directories and config
        run: |
          # Sudo installs write config under /root/.odk; user installs under ~/.odk.
          if sudo test -f /root/.odk/config.json; then
            echo "Root config initialized"
          elif test -f "$HOME/.odk/config.json"; then
            echo "User config initialized"
          else
            echo "odk config.json not found after install"
            exit 1
          fi
      - name: Verify the odkit package CLI works standalone
        run: |
          pip install -e .
          odkit doctor
          odkit modules list
